# dsh-session-actions: sidebar Conversation actions for the Web UI — open the
# row menu on right-click, rename by double-click, copy the session id, and
# permanently delete a Conversation together with its storage.
#
# This is the package's bundle layer: a profile that lists `dsh-session-actions`
# in `dsh.profile.bundles` applies it automatically, which is how the plugin
# manager and the community market install it. The browser half needs no row of
# its own — it is discovered through the package.json `dsh.client` declaration.
#
# A profile that instead inserts the package by hand in its own
# `cordis.patch.yml` must NOT also list it as a bundle: the row would load the
# plugin twice.
- insert:
    - id: session-actions
      name: 'dsh-session-actions'
